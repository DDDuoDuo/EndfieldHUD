name: Windows native feasibility
on:
  push:
    branches: [codex/windows-migration]
    paths: ['windows/**', 'Sources/**', 'Resources/**', 'scripts/package-watch-resources.py', '.github/workflows/windows.yml']
  pull_request:
    paths: ['windows/**', 'Sources/**', 'Resources/**', 'scripts/package-watch-resources.py', '.github/workflows/windows.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: windows-feasibility-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native:
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Build, isolated tests, byte-exact resources, developer preview
        shell: pwsh
        run: .\windows\packaging\build.ps1 -Python (Get-Command python.exe).Source
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: EndfieldHUD-Windows-x64-feasibility
          path: |
            windows/dist/*
            windows/build/x64/build-metadata.json
          if-no-files-found: error
          retention-days: 14
