name: Windows clean port checks
on:
  push:
    branches: [codex/windows-migration]
    paths: ['windows/**', 'Sources/**', 'Resources/**', '.github/workflows/windows.yml']
  pull_request:
    paths: ['windows/**', 'Sources/**', 'Resources/**', '.github/workflows/windows.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: windows-clean-port-${{ github.ref }}
  cancel-in-progress: true
jobs:
  core:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
        env:
          GIT_CONFIG_COUNT: '1'
          GIT_CONFIG_KEY_0: core.autocrlf
          GIT_CONFIG_VALUE_0: 'false'
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Verify current macOS source authority
        run: python windows/tools/check_source_authority.py
      - name: Configure isolated core tests
        run: cmake -S windows -B build/windows-core -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON
      - name: Build
        run: cmake --build build/windows-core --config Release --parallel 2
      - name: Test synthetic data and scene models
        run: ctest --test-dir build/windows-core -C Release --output-on-failure
      # No preview, installer, or release is produced by a core-only check.
