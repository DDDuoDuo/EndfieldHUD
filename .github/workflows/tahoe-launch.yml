name: Validate distributed app on Tahoe

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Published or draft release tag to validate
        type: string
        required: true
        default: v1.0.1
      artifact_stem:
        description: Exact version and build prefix of the release assets
        type: string
        required: true
        default: EndfieldHUD-1.0.1-build11
      dmg_sha256:
        description: Expected SHA-256 of the DMG
        type: string
        required: true
        default: 986458582a71dab69c7045ef1c0f920cb9096d0d59b771ef1080f11b3226eee4
      pkg_sha256:
        description: Expected SHA-256 of the installer
        type: string
        required: true
        default: 4c4dc8fcbaf57b0c760761bdb99545f2d5823cdba276cc7a6b447a2870440e8e
  push:
    paths:
      - .github/workflows/tahoe-launch.yml
      - scripts/test-distributed-launch.sh
      - scripts/package-installer.sh
      - scripts/test-installer-package.sh
      - scripts/normalize-bundle-permissions.py
      - scripts/test-bundle-permissions.py
      - scripts/build.sh
      - scripts/verify-bundle.sh

permissions:
  contents: read

concurrency:
  group: tahoe-launch-${{ github.ref }}
  cancel-in-progress: true

env:
  # Push runs continue to verify the existing stable release. Manual runs
  # can verify the exact bytes of a draft candidate before publication.
  RELEASE_TAG: ${{ inputs.release_tag || 'v1.0.1' }}
  ARTIFACT_STEM: ${{ inputs.artifact_stem || 'EndfieldHUD-1.0.1-build11' }}
  DMG_SHA256: ${{ inputs.dmg_sha256 || '986458582a71dab69c7045ef1c0f920cb9096d0d59b771ef1080f11b3226eee4' }}
  PKG_SHA256: ${{ inputs.pkg_sha256 || '4c4dc8fcbaf57b0c760761bdb99545f2d5823cdba276cc7a6b447a2870440e8e' }}

jobs:
  download-release:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # GitHub requires push access to discover draft releases. This job only
    # downloads and hashes assets; it never checks out or executes repo code.
    permissions:
      contents: write
    steps:
      - name: Validate release asset inputs
        shell: bash
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)(-preview\.[1-9][0-9]*)?$ ]]; then
            printf 'Invalid release tag.\n' >&2
            exit 1
          fi
          RELEASE_VERSION="${BASH_REMATCH[1]}"
          if [[ ! "$ARTIFACT_STEM" =~ ^EndfieldHUD-([0-9]+\.[0-9]+\.[0-9]+)-build([1-9][0-9]*)$ ]]; then
            printf 'Invalid artifact prefix.\n' >&2
            exit 1
          fi
          if [[ "${BASH_REMATCH[1]}" != "$RELEASE_VERSION" ]]; then
            printf 'Release tag and artifact version differ.\n' >&2
            exit 1
          fi
          if [[ ! "$DMG_SHA256" =~ ^[0-9a-f]{64}$ || ! "$PKG_SHA256" =~ ^[0-9a-f]{64}$ ]]; then
            printf 'Expected two lowercase SHA-256 digests.\n' >&2
            exit 1
          fi
      - name: Download and verify release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir release-assets
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern "$ARTIFACT_STEM-macOS.dmg" \
            --pattern "$ARTIFACT_STEM-Installer.pkg" --dir release-assets
          cd release-assets
          printf '%s  %s\n' "$DMG_SHA256" "$ARTIFACT_STEM-macOS.dmg" | sha256sum --check -
          printf '%s  %s\n' "$PKG_SHA256" "$ARTIFACT_STEM-Installer.pkg" | sha256sum --check -
      - name: Preserve verified release inputs
        uses: actions/upload-artifact@v7
        with:
          name: tahoe-release-inputs
          path: release-assets/
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
  published-app:
    needs: download-release
    runs-on: macos-26
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Download verified release inputs
        uses: actions/download-artifact@v8
        with:
          name: tahoe-release-inputs
          path: ${{ runner.temp }}/release-assets/
      - name: Check bundle permission regressions
        run: python3 scripts/test-bundle-permissions.py
      - name: Verify and mount the release DMG
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/endfield-launch" build/tahoe-launch
          cd "$RUNNER_TEMP/endfield-launch"
          cp "$RUNNER_TEMP/release-assets/$ARTIFACT_STEM-macOS.dmg" .
          printf '%s  %s\n' "$DMG_SHA256" "$ARTIFACT_STEM-macOS.dmg" | shasum -a 256 -c -
          mkdir mount
          trap 'hdiutil detach "$RUNNER_TEMP/endfield-launch/mount" || true' EXIT
          hdiutil attach "$ARTIFACT_STEM-macOS.dmg" -readonly -nobrowse -mountpoint "$PWD/mount"
          ditto mount/EndfieldHUD.app EndfieldHUD.app
      - name: Verify requested release metadata
        run: |
          python3 - <<'PYMETADATA'
          import json
          import os
          from pathlib import Path
          import plistlib
          app = Path(os.environ['RUNNER_TEMP']) / 'endfield-launch/EndfieldHUD.app'
          info = plistlib.loads((app / 'Contents/Info.plist').read_bytes())
          tag, stem = os.environ['RELEASE_TAG'], os.environ['ARTIFACT_STEM']
          version = tag[1:].split('-preview.', 1)[0]
          build = stem.rsplit('-build', 1)[1]
          assert info['HUDReleaseTag'] == tag, 'App release tag differs from requested release'
          assert info['CFBundleShortVersionString'] == version, 'App version differs from requested release'
          assert info['CFBundleVersion'] == build, 'App build differs from requested release'
          record = {'releaseTag': tag, 'artifactStem': stem, 'version': version, 'build': build,
                    'dmgSHA256': os.environ['DMG_SHA256'], 'pkgSHA256': os.environ['PKG_SHA256']}
          Path('build/tahoe-launch/release-inputs.json').write_text(json.dumps(record, indent=2) + '\n')
          PYMETADATA
      - name: Check the distributed app without rebuilding it
        run: scripts/test-distributed-launch.sh "$RUNNER_TEMP/endfield-launch/EndfieldHUD.app" build/tahoe-launch
      - name: Verify and inspect the release installer
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/endfield-installer"
          cp "$RUNNER_TEMP/release-assets/$ARTIFACT_STEM-Installer.pkg" "$RUNNER_TEMP/endfield-installer/"
          printf '%s  %s\n' "$PKG_SHA256" "$RUNNER_TEMP/endfield-installer/$ARTIFACT_STEM-Installer.pkg" | shasum -a 256 -c -
          scripts/test-installer-package.sh "$RUNNER_TEMP/endfield-installer/$ARTIFACT_STEM-Installer.pkg" "$RUNNER_TEMP/endfield-launch/EndfieldHUD.app"
      - name: Verify clean replacement and same-version repair
        shell: bash
        run: |
          # This is a disposable hosted runner, never the user's Mac. The
          # installer contains no scripts and changes no security settings.
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test ! -e /Applications/EndfieldHUD.app
          mkdir -p build/tahoe-launch/installer
          sudo ditto "$RUNNER_TEMP/endfield-launch/EndfieldHUD.app" /Applications/EndfieldHUD.app
          for pass in 1 2; do
            sudo touch /Applications/EndfieldHUD.app/Contents/obsolete-installer-verification.txt
            sudo installer -pkg "$RUNNER_TEMP/endfield-installer/$ARTIFACT_STEM-Installer.pkg" -target / \
              | tee "build/tahoe-launch/installer/install-$pass.log"
            test ! -e /Applications/EndfieldHUD.app/Contents/obsolete-installer-verification.txt
          done
          scripts/test-distributed-launch.sh /Applications/EndfieldHUD.app build/tahoe-launch/installer/launch
          cmp "$RUNNER_TEMP/endfield-launch/EndfieldHUD.app/Contents/MacOS/EndfieldHUD" /Applications/EndfieldHUD.app/Contents/MacOS/EndfieldHUD
      - name: Preserve the tested installer
        uses: actions/upload-artifact@v7
        with:
          name: tahoe-tested-installer
          path: ${{ runner.temp }}/endfield-installer/
          retention-days: 7
      - name: Preserve compatibility evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: tahoe-published-app-launch
          path: build/tahoe-launch
          retention-days: 7
